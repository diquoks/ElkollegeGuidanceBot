          - answer: "Про искусство и творчество"
            type_id: 1
          - answer: "Про людей и их отношения"
            type_id: 2
          - answer: "Про загадки и расследования"
            type_id: 3
          - answer: "Про природу и путешествия"
            type_id: 4
          - answer: "Про спорт и приключения"
            type_id: 5
      - question: "Что тебе нравится делать в интернете?"
        answers:
          - answer: "Смотреть как что-то делают руками"
            type_id: 0
          - answer: "Искать красивые картинки, музыку, видео"
            type_id: 1
          - answer: "Общаться в чатах, комментировать, помогать"
            type_id: 2
          - answer: "Проходить квесты, решать задачи"
            type_id: 3
