            type_id: 4
          - answer: "Физкультура / ОБЖ"
            type_id: 5
      - question: "Что бы ты выбрал(а) на выставке?"
        answers:
          - answer: "Стенд с роботами и техникой"
            type_id: 0
          - answer: "Картинная галерея или концерт"
            type_id: 1
          - answer: "Лекция о психологии или общении"
            type_id: 2
          - answer: "Головоломки и научные эксперименты"
            type_id: 3
          - answer: "Зона с животными или садом"
            type_id: 4
          - answer: "Зона с животными или садом"
            type_id: 5
      - question: "Какую книгу или фильм ты выберешь?"
