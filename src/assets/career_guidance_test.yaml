# Типы блоков:
# 1 - выбор одного варианта из нескольких
# 2 - выбор Да / Нет

blocks:
  - id: 1
    title: "Что мне интересно?"
    type: 1
    hint: "Выбери один вариант ответа."
    questions:
      - question: "Что тебе интереснее делать в свободное время?"
        answers:
          - answer: "Разбирать что-то, собирать, мастерить"
            type_id: 0
          - answer: "Рисовать, писать, придумывать истории"
            type_id: 1
          - answer: "Общаться с друзьями, помогать им"
            type_id: 2
          - answer: "Играть в игры на логику, решать головоломки"
            type_id: 3
          - answer: "Ухаживать за животными или растениями"
            type_id: 4
          - answer: "Выступать, петь, танцевать, снимать видео"
            type_id: 5
      - question: "Какой школьный предмет тебе нравится больше всего?"
        answers:
          - answer: "Труд / Технология"
            type_id: 0
          - answer: "Литература / ИЗО / Музыка"
            type_id: 1
          - answer: "Обществознание / История"
            type_id: 2
          - answer: "Математика / Информатика"
            type_id: 3
