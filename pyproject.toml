[project]
name = "elkollege_guidance_bot"
version = "0.0.0"
dependencies = [
    "aiogram (==3.31.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "xlsxwriter (>=3.2.9,<4.0.0)",
]
requires-python = ">=3.14.0,<3.15.0"

[dependency-groups]
dev = [
    "poetry (>=2.4.1,<3.0.0)",
]

[tool.pytest]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core (>=2.4.0,<3.0.0)"]
build-backend = "poetry.core.masonry.api"
